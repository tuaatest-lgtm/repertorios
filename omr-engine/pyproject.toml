[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palermo-omr"
version = "0.3.0"
description = "Motor propio de reconocimiento óptico musical para Palermo Music"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
palermo-omr = "palermo_omr.cli:main"
palermo-omr-dataset = "palermo_omr.annotation_cli:main"
palermo-omr-glyphs = "palermo_omr.glyph_annotation_cli:main"
palermo-omr-glyph-dataset = "palermo_omr.glyph_dataset_cli:main"
palermo-omr-glyph-evaluate = "palermo_omr.glyph_evaluation_cli:main"
palermo-omr-glyph-features = "palermo_omr.glyph_features_cli:main"
palermo-omr-glyph-baseline = "palermo_omr.glyph_baseline_cli:main"
palermo-omr-glyph-train = "palermo_omr.glyph_train_cli:main"
palermo-omr-glyph-predict = "palermo_omr.glyph_predict_cli:main"
palermo-omr-pdf-glyph-evaluate = "palermo_omr.pdf_glyph_validation_cli:main"
palermo-omr-midi = "palermo_omr.midi_export_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
