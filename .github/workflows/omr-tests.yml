name: Palermo OMR tests

on:
  push:
    branches:
      - main
      - feature/omr-propio-palermo
    paths:
      - "omr-engine/**"
      - ".github/workflows/omr-tests.yml"
  pull_request:
    paths:
      - "omr-engine/**"
      - ".github/workflows/omr-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omr-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: omr-engine/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Test browser API client
        run: node --test web/test-omr-client.mjs
      - name: Test browser Web Audio playback
        run: node --test web/test-web-audio-playback.mjs
      - name: Test score visual cursor
        run: node --test web/test-score-visual-cursor.mjs
      - name: Test audio-driven score playback session
        run: node --test web/test-score-playback-session.mjs
      - name: Package source snapshot for reproducible validation
        if: github.ref == 'refs/heads/feature/omr-propio-palermo'
        run: tar -czf ../palermo-omr-source.tar.gz src pyproject.toml
      - name: Upload source snapshot
        if: github.ref == 'refs/heads/feature/omr-propio-palermo'
        uses: actions/upload-artifact@v4
        with:
          name: palermo-omr-source-${{ github.sha }}
          path: palermo-omr-source.tar.gz
          retention-days: 2
