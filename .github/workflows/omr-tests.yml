name: Palermo OMR tests

on:
  push:
    branches:
      - main
      - feature/omr-propio-palermo
    paths:
      - "omr-engine/**"
      - ".github/workflows/omr-tests.yml"
  pull_request:
    paths:
      - "omr-engine/**"
      - ".github/workflows/omr-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omr-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: omr-engine/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
